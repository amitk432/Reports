name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub Actions publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          if [ "$pages_build_type" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions. Branch publishing can overwrite the app with the README."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build # validates records/index.json, then builds app/dist with records/ and reports/
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
